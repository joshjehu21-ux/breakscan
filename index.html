<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva pagina BreakScan</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/hixGuqF.png">

<style>
/* =========================================================
   CONFIGURACIÓN RÁPIDA
   ========================================================= */
:root {
    --fondo: url(https://i.imgur.com/dgvZAkM.png);
    --oscurecer: rgba(0, 0, 0, 0.38);

    --borde: rgba(255,255,255,0.95);
    --boton: rgba(0,0,0,0.32);

    /* Logo más pequeño */
    --logo-ancho: 170px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

/* Animación centrada, lenta y con rango de movimiento corto para que parezca fondo de pantalla */
@keyframes moverFondo {
    0% {
        background-position: 50% center;
    }
    50% {
        background-position: 58% center;
    }
    100% {
        background-position: 50% center;
    }
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    background-image:
        linear-gradient(var(--oscurecer), var(--oscurecer)),
        var(--fondo);

    /* Volvemos a 'cover' para que se adapte perfectamente a la ventana sin zoom forzado de PC */
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    /* Inicia y oscila suavemente desde el centro */
    animation: moverFondo 120s ease-in-out infinite;

    display: flex;
    justify-content: center;
}

.pagina {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    /* Reducido el espacio superior para acercar el logo a la línea roja superior */
    padding-top: 25px;
    padding-bottom: 50px;
}

.logo {
    width: var(--logo-ancho);
    max-width: 30vw;
    height: auto;
    display: block;

    filter: drop-shadow(0 5px 8px rgba(0,0,0,.65));

    /* Reducido el espacio inferior para acercar el logo al título (línea roja inferior) */
    margin-bottom: 55px;
	margin-top: 45px;
}

.titulo {
    font-size: clamp(30px, 3vw, 50px);
    line-height: 1.1;
    font-weight: 700;
    text-align: center;

    text-shadow:
        0 3px 7px rgba(0,0,0,.95),
        0 0 14px rgba(0,0,0,.45);

    margin-bottom: 45px;
}

.enlaces {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 35px;

    width: min(1280px, 92vw);
}

.boton {
    position: relative;

    width: 360px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    border: 3px solid var(--borde);
    border-radius: 12px;

    background: var(--boton);

    color: #fff;
    text-decoration: none;

    font-size: clamp(20px, 1.4vw, 28px);
    font-weight: 400;

    text-shadow: 0 2px 6px rgba(0,0,0,.9);

    overflow: hidden;

    backdrop-filter: blur(1px);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.boton:hover {
    transform: translateY(-4px);
    background: rgba(0,0,0,.48);
    box-shadow: 0 9px 25px rgba(0,0,0,.45);
}

.boton::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.22),
            rgba(0,0,0,.04),
            rgba(0,0,0,.22)
        );
    pointer-events: none;
}

.icono {
    position: relative;
    z-index: 1;

    width: 50px;
    height: 50px;

    flex: 0 0 50px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.icono svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: white;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;

    filter: drop-shadow(0 2px 4px rgba(0,0,0,.8));
}

.icono.discord svg,
.icono.telegram svg {
    fill: white;
    stroke: none;
}

.texto {
    position: relative;
    z-index: 1;
    white-space: nowrap;
}


/* =========================================================
   TABLET / CELULAR
   ========================================================= */

@media (max-width: 1000px) {
    .pagina {
        padding-top: 25px;
    }

    .logo {
        margin-bottom: 30px;
    }

    .titulo {
        margin-bottom: 35px;
    }

    .enlaces {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .boton {
        width: min(500px, 90vw);
    }
}

@media (max-width: 550px) {
    body {
        background-attachment: scroll;
        background-size: cover;
    }

    .pagina {
        padding-top: 20px;
        padding-bottom: 30px;
    }

    .logo {
        width: 140px;
        max-width: 45vw;
        margin-bottom: 25px;
    }

    .titulo {
        font-size: 28px;
        padding: 0 15px;
        margin-bottom: 25px;
    }

    .boton {
        width: 92vw;
        height: 90px;
        font-size: 21px;
        border-width: 2px;
    }

    .icono {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }
}
</style>
</head>

<body>

<main class="pagina">

    <img
        class="logo"
        src="https://i.imgur.com/N8fgnwi.png"
        alt="BreakScan"
    >

    <h1 class="titulo">¡Visita nuestra Página Web!</h1>

    <section class="enlaces">

        <a
            class="boton"

        <a

                </svg>
            </span>

                </svg>
            </span>
            <span class="texto">Nuestro Telegram</span>
        </a>

    </section>

</main>

</body>
</html>
